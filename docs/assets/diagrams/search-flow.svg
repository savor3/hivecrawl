<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-label="How a search is answered"><title>How a search is answered</title><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#5a4a20" flood-opacity=".09"/></filter><marker id="ae2900c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2900c"/></marker><marker id="se2900c" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2900c"/></marker><marker id="ac2410c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="sc2410c" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="a12897f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12897f"/></marker><marker id="s12897f" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12897f"/></marker></defs><rect width="100%" height="100%" fill="#f5f6f8"/>
<text x="60" y="64" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="26" font-weight="750" fill="#1f2a37" text-anchor="start">How a search is answered</text>
<text x="60" y="92" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#5b6675" text-anchor="start">Most queries finish at step 2. Only engines that were blocked get retried, and each route gets a different part.</text>
<rect x="60" y="140" width="230" height="110" rx="14" fill="#eef1f5" stroke="#cdd4de" stroke-width="1.3"/>
<text x="78" y="172" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2a37" text-anchor="start">Your query</text>
<text x="78" y="196.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">&quot;kerala monsoon forecast&quot;</text>
<path d="M290,195 L350,195" fill="none" stroke="#e2900c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ae2900c)"/>
<rect x="360" y="140" width="260" height="110" rx="14" fill="#ffffff" stroke="#cdd4de" stroke-width="1.3"/>
<text x="378" y="172" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2a37" text-anchor="start">1  Cache</text>
<text x="378" y="196.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">same query in the last hour?</text>
<text x="378" y="215.575" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">answer instantly</text>
<path d="M620,195 L680,195" fill="none" stroke="#e2900c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ae2900c)"/>
<rect x="690" y="140" width="300" height="110" rx="14" fill="#ffffff" stroke="#cdd4de" stroke-width="1.3"/>
<text x="708" y="172" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2a37" text-anchor="start">2  This node&#x27;s engines</text>
<text x="708" y="196.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">Google, Brave, DuckDuckGo,</text>
<text x="708" y="215.575" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">Startpage, Mojeek via SearXNG</text>
<path d="M990,195 L1100,195" fill="none" stroke="#12897f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a12897f)"/>
<rect x="989" y="165" width="112" height="22" rx="6" fill="#f5f6f8"/>
<text x="1045" y="180" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#12897f" text-anchor="middle">enough results</text>
<rect x="1110" y="140" width="430" height="110" rx="14" fill="#e0f5f3" stroke="#a9e0da" stroke-width="1.3"/>
<text x="1128" y="172" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2a37" text-anchor="start">Firecrawl-shaped response</text>
<text x="1128" y="196.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">body identical to Firecrawl&#x27;s;</text>
<text x="1128" y="215.575" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">X-HC-Source, X-HC-Engines, X-HC-Blocked headers</text>
<path d="M840,250 L840,330" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac2410c)"/>
<rect x="746" y="285" width="189" height="22" rx="6" fill="#f5f6f8"/>
<text x="840" y="300" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#c2410c" text-anchor="middle">DuckDuckGo, Brave blocked</text>
<rect x="330" y="340" width="1020" height="250" rx="18" fill="#ffffff" stroke="#cdd4de" stroke-width="1.3"/>
<text x="360" y="378" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="17" font-weight="700" fill="#1f2a37" text-anchor="start">3  Retry only the blocked engines — all routes at once</text>
<rect x="360" y="402" width="960" height="48" rx="10" fill="#e8effd" stroke="#e8effd" stroke-width="1.3"/>
<text x="380" y="432" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">Cloudflare WARP</text>
<text x="600" y="432" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">DuckDuckGo + Brave from a Cloudflare IP</text>
<rect x="360" y="462" width="960" height="48" rx="10" fill="#e0f5f3" stroke="#e0f5f3" stroke-width="1.3"/>
<text x="380" y="492" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#12897f" text-anchor="start">Peer: home-laptop</text>
<text x="600" y="492" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">DuckDuckGo from a home (residential) IP</text>
<rect x="360" y="522" width="960" height="48" rx="10" fill="#e0f5f3" stroke="#e0f5f3" stroke-width="1.3"/>
<text x="380" y="552" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#12897f" text-anchor="start">Peer: cloud-2</text>
<text x="600" y="552" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start">Brave from another server&#x27;s IP</text>
<path d="M1350,465 L1420,465 L1420,260" fill="none" stroke="#e2900c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ae2900c)"/>
<rect x="1312" y="285" width="217" height="22" rx="6" fill="#f5f6f8"/>
<text x="1420" y="300" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#e2900c" text-anchor="middle">4  merge by rank (RRF), cache</text>
<text x="360" y="640" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#5b6675" text-anchor="start" font-style="italic">Peers answer only from their own cache and engines — a request is never forwarded again, so one query can&#x27;t fan out across the network.</text>
</svg>