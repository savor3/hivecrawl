<text x="474" y="260" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2a37" text-anchor="start">API</text>
<text x="474" y="284" font-family="'JetBrains Mono', 'DejaVu Sans Mono', ui-monospace, monospace" font-size="13" font-weight="400" fill="#5b6675" text-anchor="start">/v2/search  /v2/scrape  /v2/crawl  /v2/map  /v2/extract  /v2/agent  /mcp  /v1/*</text>
<rect x="454" y="326" width="316" height="106" rx="14" fill="#ffffff" stroke="#cdd4de" stroke-width="1.3"/>
<text x="472" y="358" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2a37" text-anchor="start">Search orchestrator</text>
<text x="472" y="382.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">cache → local → retry only</text>
<text x="472" y="401.575" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">blocked engines → merge</text>
<rect x="790" y="326" width="316" height="106" rx="14" fill="#ffffff" stroke="#cdd4de" stroke-width="1.3"/>
<text x="808" y="358" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2a37" text-anchor="start">Scraper</text>
<text x="808" y="382.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">Chrome fingerprint → WARP</text>
<text x="808" y="401.575" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">→ browser → peer (opt-in)</text>
<rect x="454" y="452" width="316" height="106" rx="14" fill="#ffffff" stroke="#cdd4de" stroke-width="1.3"/>
<text x="472" y="484" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2a37" text-anchor="start">Crawl &amp; jobs</text>
<text x="472" y="508.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">robots.txt, sitemaps,</text>
<text x="472" y="527.575" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">webhooks, pagination</text>
<rect x="790" y="452" width="316" height="106" rx="14" fill="#ffffff" stroke="#cdd4de" stroke-width="1.3"/>
<text x="808" y="484" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="650" fill="#1f2a37" text-anchor="start">AI (owner only)</text>
<text x="808" y="508.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">extract, agent, json,</text>
<text x="808" y="527.575" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">summary — your model</text>
<rect x="454" y="586" width="652" height="98" rx="12" fill="#ffffff" stroke="#f5c66b" stroke-width="1.3"/>
<text x="474" y="618" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#1f2a37" text-anchor="start">Mesh</text>
<text x="474" y="642.0" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">ed25519 identity + network key on every message · gossip · home-node tunnels · relay</text>
<text x="474" y="661.575" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start">proof of participation · fair-share limits · answer quality scores</text>
<text x="454" y="740" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#5b6675" text-anchor="start" font-style="italic">Settings and keys: /data (owner-only files). No shell, no plugins, never runs programs.</text>
<text x="1200" y="150" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#5b6675" text-anchor="start">PRIVATE CONTAINERS</text>
