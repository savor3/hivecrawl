<text x="60" y="64" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="26" font-weight="750" fill="#1f2a37" text-anchor="start">Inside one HiveCrawl node</text>
<text x="60" y="92" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#5b6675" text-anchor="start">Four containers from docker-compose.yml. Only the node talks to the outside; everything else is private.</text>
<text x="60" y="150" font-family="Inter, 'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#5b6675" text-anchor="start">YOUR APPS</text>
