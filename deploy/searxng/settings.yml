  # ---- free JSON APIs SearXNG has no engine for (categories only) ----
  - name: internet archive
    engine: json_engine
    shortcut: ia
    categories: [books]
    paging: true
    search_url: https://archive.org/advancedsearch.php?q={query}&fl[]=identifier&fl[]=title&fl[]=description&fl[]=mediatype&rows=10&page={pageno}&output=json
    results_query: response/docs
    url_query: identifier
    url_prefix: https://archive.org/details/
    title_query: title
    content_query: description
    content_html_to_text: true
    timeout: 6.0
    disabled: true
  - name: gutenberg
    engine: json_engine
    shortcut: gut
    categories: [books]
    paging: false
    search_url: https://gutendex.com/books/?search={query}
    results_query: results
    url_query: id
    url_prefix: https://www.gutenberg.org/ebooks/
    title_query: title
    content_query: summaries
    timeout: 6.0
    disabled: true
  - name: apple podcasts
    engine: json_engine
    shortcut: apod
    categories: [music]
    paging: false
    search_url: https://itunes.apple.com/search?term={query}&media=podcast&limit=10
    results_query: results
    url_query: collectionViewUrl
    title_query: collectionName
    content_query: artistName
    timeout: 6.0
    disabled: true

  # ---- WARP fallbacks (selected explicitly by HiveCrawl) ----
  - name: google cse warp
    engine: google_cse
    shortcut: gocw
    disabled: true
    proxies: &warp
      all://:
        - socks5h://warp:40000
  - name: brave warp
    engine: brave
    shortcut: brw
    brave_category: search
    time_range_support: true
    paging: true
    categories: [general, web]
    disabled: true
    proxies: *warp
  - name: duckduckgo warp
    engine: duckduckgo
    shortcut: ddgw
    disabled: true
    proxies: *warp
  - name: startpage warp
    engine: startpage
    shortcut: spw
    startpage_categ: web
    disabled: true
    proxies: *warp
  - name: mojeek warp
    engine: mojeek
    shortcut: mjkw
    categories: [general, web]
    disabled: true
    proxies: *warp
  # News and image copies. No "network:" so they never share the direct
  # engine's (unproxied) network.
  - name: google news warp
    engine: google_news
    shortcut: gonw
    categories: [news]
    disabled: true
    proxies: *warp
  - name: brave.news warp
    engine: brave
    shortcut: brnw
    categories: [news]
    brave_category: news
    disabled: true
    proxies: *warp
  - name: duckduckgo news warp
    engine: duckduckgo_extra
    shortcut: ddnw
    categories: [news]
    ddg_category: news
    disabled: true
    proxies: *warp
  - name: yahoo news warp
    engine: yahoo_news
    shortcut: yhnw
    categories: [news]
    disabled: true
    proxies: *warp
  - name: google images warp
    engine: google_images
    shortcut: goiw
    categories: [images]
    disabled: true
    proxies: *warp
  - name: brave.images warp
    engine: brave
    shortcut: brimw
    categories: [images]
    brave_category: images
    disabled: true
    proxies: *warp
  - name: duckduckgo images warp
    engine: duckduckgo_extra
    shortcut: ddiw
    categories: [images]
    ddg_category: images
    disabled: true
    proxies: *warp
