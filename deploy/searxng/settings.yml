# SearXNG as HiveCrawl's engine backend. Not exposed outside the compose
# network; only the hivecrawl container talks to it.
#
# Normal searches use the direct engines from this node's own IP. Each has a
# "<name> warp" copy that goes out through Cloudflare WARP; the copies are
# disabled, so they only run when HiveCrawl asks for them by name after the
# direct engine was blocked.
use_default_settings:
  engines:
    keep_only:
      - google cse
      - brave
      - duckduckgo
      - startpage
      - mojeek
      - wikipedia
      # more web indexes; each scored >=95% relevant on test queries
      - yandex
      - yahoo
      - naver
      - mwmbl
      - yacy
      - 360search
      - gmx
      - fynd
      # images (sources: ["images"])
      - google images
      - brave.images
      - duckduckgo images
      - startpage images
      - mojeek images
      - wikicommons.images
      - yandex images
      - naver images
      - baidu images
      - quark images
      - yacy images
      - flickr
      - openverse
      - artic
      - artstation
      - ipernity
      - pexels
      - stocksnap
      - picjumbo
      - magnific
      - shopify stock
      - pixabay images
      - public domain image archive
      - 500px
      # news (sources: ["news"]); these carry publish dates
      - google news
      - brave.news
      - duckduckgo news
      - startpage news
      - yahoo news
      - mojeek news
      - wikinews
      - naver news
      # specialist engines for categories (node.Topics); disabled below so
      # they only run when a category search names them
      - arxiv
      - pubmed
      - europepmc
      - crossref
      - openalex
      - openairepublications
      - openairedatasets
      - pdbe
      - github
      - gitlab
      - codeberg
      - gitea.com
      - sourcehut
      - stackoverflow
      - superuser
      - askubuntu
      - mdn
      - microsoft learn
      - hackernews
      - discuss.python
      - caddy.community
      - pi-hole.community
      - mankier
      - hoogle
      - gentoo
      - nixos wiki
      - national vulnerability database
      - huggingface
      - npm
      - pkg.go.dev
      - crates.io
      - lib.rs
      - hex
      - packagist
      - pub.dev
      - docker hub
      - alpine linux packages
      - voidlinux
      - cachy os packages
      - huggingface datasets
      - huggingface spaces
      - youtube
      - vimeo
      - dailymotion
      - sepiasearch
      - odysee
      - media.ccc.de
      - bilibili
      - acfun
      - iqiyi
      - 360search videos
      - sogou videos
      - wikicommons.videos
      - pixabay videos
      - lemmy posts
      - lemmy comments
      - lemmy communities
      - lemmy users
      - mastodon users
      - mastodon hashtags
      - boardreader
      - openlibrary
      - wikibooks
      - wikisource
      - wikiquote
      - genius
      - deezer
      - soundcloud
      - mixcloud
      - radio browser
      - wikicommons.audio
      - fyyd
      - imdb
      - rottentomatoes
      - apple app store
      - google play apps
      - fdroid
      - steam
      - photon
      - wiktionary
      - wikivoyage
      - wikiversity
      - wikispecies
      - internet archive
      - gutenberg
      - apple podcasts
    # Not bing: it serves scrapers plausible-looking but unrelated results
    # instead of blocking them, which poisons merged results.
server:
  limiter: false
  bind_address: "0.0.0.0"
  public_instance: false
search:
  formats: [html, json]
outgoing:
  request_timeout: 4.0
engines:
